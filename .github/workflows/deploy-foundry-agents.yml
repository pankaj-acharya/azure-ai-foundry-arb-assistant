name: Deploy Foundry Agents

on:
  workflow_call:
    inputs:
      enable_persistent_agent_deploy:
        required: false
        type: boolean
        default: true
      run_single_agent_smoke:
        required: false
        type: boolean
        default: true
      run_multi_agent_smoke:
        required: false
        type: boolean
        default: false
      blog_url:
        required: false
        type: string
        default: ""
      max_input_chars:
        required: false
        type: string
        default: "12000"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_AI_FOUNDRY_PROJECT_NAME: ${{ secrets.AZURE_AI_FOUNDRY_PROJECT_NAME }}
      ENABLE_PERSISTENT_AGENT_DEPLOY: ${{ github.event_name == 'workflow_call' && (inputs.enable_persistent_agent_deploy && 'true' || 'false') || vars.ENABLE_PERSISTENT_AGENT_DEPLOY }}
      RUN_SINGLE_AGENT_SMOKE: ${{ github.event_name == 'workflow_call' && (inputs.run_single_agent_smoke && 'true' || 'false') || 'true' }}
      RUN_MULTI_AGENT_SMOKE: ${{ github.event_name == 'workflow_call' && (inputs.run_multi_agent_smoke && 'true' || 'false') || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate required CI inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${AZURE_CLIENT_ID:-}" ]] || missing+=("AZURE_CLIENT_ID secret")
          [[ -n "${AZURE_TENANT_ID:-}" ]] || missing+=("AZURE_TENANT_ID secret")
          [[ -n "${AZURE_SUBSCRIPTION_ID:-}" ]] || missing+=("AZURE_SUBSCRIPTION_ID secret")
          [[ -n "${AZURE_AI_FOUNDRY_PROJECT_ENDPOINT:-}" ]] || missing+=("AZURE_AI_FOUNDRY_PROJECT_ENDPOINT secret")
          [[ -n "${AZURE_AI_FOUNDRY_PROJECT_NAME:-}" ]] || missing+=("AZURE_AI_FOUNDRY_PROJECT_NAME secret")

          BLOG_URL_VALUE="${{ github.event_name == 'workflow_call' && inputs.blog_url || vars.BLOG_URL }}"
          [[ -n "${BLOG_URL_VALUE:-}" ]] || missing+=("BLOG_URL variable or workflow input")
          MODEL_NAME_VALUE="${{ vars.AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT_NAME }}"
          [[ -n "${MODEL_NAME_VALUE:-}" ]] || missing+=("AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT_NAME variable")

          if (( ${#missing[@]} > 0 )); then
            echo "[validate] Missing required settings:"
            for item in "${missing[@]}"; do
              echo " - ${item}"
            done
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime .env
        shell: bash
        run: |
          cat > .env << 'EOF'
          AZURE_RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT_NAME=${{ vars.AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT_NAME }}
          BLOG_URL=${{ github.event_name == 'workflow_call' && inputs.blog_url || vars.BLOG_URL }}
          MAX_INPUT_CHARS=${{ github.event_name == 'workflow_call' && inputs.max_input_chars || vars.MAX_INPUT_CHARS }}
          OUTPUT_FOLDER=outputs
          LOG_LEVEL=INFO
          EOF

      - name: Run unit tests
        run: python -m pytest

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Show deployment mode
        shell: bash
        run: |
          if [ "${ENABLE_PERSISTENT_AGENT_DEPLOY,,}" = "true" ]; then
            echo "[mode] Persistent agent provisioning is ENABLED"
          else
            echo "[mode] Persistent agent provisioning is DISABLED"
          fi

      - name: Preflight Foundry checks
        if: ${{ env.ENABLE_PERSISTENT_AGENT_DEPLOY == 'true' || env.ENABLE_PERSISTENT_AGENT_DEPLOY == 'TRUE' || env.ENABLE_PERSISTENT_AGENT_DEPLOY == 'True' }}
        run: python scripts/deploy_foundry_agents.py --preflight-only --strict

      - name: Deploy/Update Foundry agents
        if: ${{ env.ENABLE_PERSISTENT_AGENT_DEPLOY == 'true' || env.ENABLE_PERSISTENT_AGENT_DEPLOY == 'TRUE' || env.ENABLE_PERSISTENT_AGENT_DEPLOY == 'True' }}
        run: python scripts/deploy_foundry_agents.py --strict

      - name: Run one-agent smoke deployment check
        if: ${{ env.RUN_SINGLE_AGENT_SMOKE == 'true' || env.RUN_SINGLE_AGENT_SMOKE == 'TRUE' || env.RUN_SINGLE_AGENT_SMOKE == 'True' }}
        run: python scripts/smoke_test_single_agent.py

      - name: Run multi-agent smoke deployment check
        if: ${{ env.RUN_MULTI_AGENT_SMOKE == 'true' || env.RUN_MULTI_AGENT_SMOKE == 'TRUE' || env.RUN_MULTI_AGENT_SMOKE == 'True' }}
        run: python scripts/smoke_test.py
