name: Deploy Foundry Agents

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_AI_FOUNDRY_PROJECT_NAME: ${{ secrets.AZURE_AI_FOUNDRY_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime .env
        shell: bash
        run: |
          cat > .env << 'EOF'
          AZURE_RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT_NAME=${{ vars.AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT_NAME }}
          BLOG_URL=${{ vars.BLOG_URL }}
          MAX_INPUT_CHARS=${{ vars.MAX_INPUT_CHARS }}
          OUTPUT_FOLDER=outputs
          LOG_LEVEL=INFO
          EOF

      - name: Run unit tests
        run: python -m pytest

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight Foundry checks
        run: python scripts/deploy_foundry_agents.py --preflight-only --strict

      - name: Deploy/Update Foundry agents
        run: python scripts/deploy_foundry_agents.py --strict

      - name: Run smoke test
        run: python scripts/smoke_test.py
        continue-on-error: true
