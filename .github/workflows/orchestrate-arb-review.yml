name: Orchestrate ARB Review

on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: "Public page URL to review"
        required: true
        type: string
      max_input_chars:
        description: "Maximum source characters to include in prompts"
        required: false
        default: "12000"
        type: string
      model_deployment_name:
        description: "Model deployment to use for agents"
        required: false
        default: "gpt-5.4"
        type: choice
        options:
          - gpt-5.4
          - gpt-5.4-mini
          - gpt-5
          - gpt-4.1
          - gpt-4.1-mini
          - claude-haiku-4.5
          - claude-opus-4.8
          - claude-sonnet-5
          - claude-opus-5
      agent_action:
        description: "Action to perform on agents before orchestration"
        required: false
        default: "deploy"
        type: choice
        options:
          - deploy
          - enable
          - disable
          - delete

permissions:
  id-token: write
  contents: read

jobs:
  deploy-agents:
    uses: ./.github/workflows/deploy-foundry-agents.yml
    with:
      enable_persistent_agent_deploy: true
      run_single_agent_smoke: ${{ inputs.agent_action == 'deploy' }}
      run_multi_agent_smoke: false
      blog_url: ${{ inputs.blog_url }}
      max_input_chars: ${{ inputs.max_input_chars }}
      model_deployment_name: ${{ inputs.model_deployment_name }}
      agent_action: ${{ inputs.agent_action }}
    secrets: inherit

  run-persistent-orchestration:
    runs-on: ubuntu-latest
    needs: deploy-agents
    if: ${{ inputs.agent_action == 'deploy' || inputs.agent_action == '' }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_AI_FOUNDRY_PROJECT_NAME: ${{ secrets.AZURE_AI_FOUNDRY_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime .env
        shell: bash
        run: |
          MODEL_NAME="${{ inputs.model_deployment_name }}"
          # Normalize dots to hyphens — Azure deployment names use hyphens (e.g. gpt-5-4 not gpt-5.4)
          MODEL_NAME="${MODEL_NAME//./-}"
          cat > .env << EOF
AZURE_RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}
AZURE_AI_FOUNDRY_MODEL_DEPLOYMENT_NAME=${MODEL_NAME}
BLOG_URL=${{ inputs.blog_url }}
MAX_INPUT_CHARS=${{ inputs.max_input_chars }}
OUTPUT_FOLDER=outputs
LOG_LEVEL=INFO
EOF

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run persistent multi-agent orchestration
        run: python scripts/orchestrate_persistent_agents.py

      - name: Upload ARB report artifact
        uses: actions/upload-artifact@v4
        with:
          name: arb-review-report
          path: outputs/arb-review.md
