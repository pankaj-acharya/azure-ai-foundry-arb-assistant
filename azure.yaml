# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: pankaj-acharya-congenial-happiness
services:
    arb-review-workflow-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - proj_foundry_labs
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: src/hosted_arb_workflow.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # The workflow code calls _project_endpoint() at startup which reads
            # this env var. Without it the container crashes on launch.
            - name: AZURE_AI_FOUNDRY_PROJECT_ENDPOINT
              value: https://ArchReviewAssistant.services.ai.azure.com/api/projects/proj_foundry_labs
        kind: hosted
        name: arb-review-workflow-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    proj_foundry_labs:
        host: azure.ai.project
        endpoint: https://ArchReviewAssistant.services.ai.azure.com/api/projects/proj_foundry_labs
infra:
    provider: microsoft.foundry
